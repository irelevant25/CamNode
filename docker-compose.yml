# ---------------------------------------------------------------------------
# Builds the image from the source next to this file. Use it on the Docker host:
#
#     docker compose up -d --build
#
# To deploy through Portainer instead, build the image once (see "Building the
# image" in README.md) and paste docker-compose.portainer.yml into the stack
# editor – that one only references the finished image.
# ---------------------------------------------------------------------------

services:
  camera-recordings:
    build: .
    image: camera-recordings:latest
    container_name: camera-recordings
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-Europe/Bratislava}"
      DATA_DIR: /data
      # `:?` on purpose: refuse to start rather than come up with a guessable
      # secret. Put these in a .env file next to this compose file.
      APP_SECRET: "${APP_SECRET:?set APP_SECRET to a long random string}"
      # Only applied when the database is created for the first time.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the first-run account}"
      SESSION_HOURS: "${SESSION_HOURS:-72}"
      # Cameras POST their ONVIF events back to this address. A bridged
      # container IP is not reachable from a camera, so point this at the Docker
      # host, e.g. http://192.168.1.10:8080
      PUBLIC_URL: "${PUBLIC_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      # Database, recordings, snapshots and thumbnails all live here.
      - camera-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  camera-data:
    # Swap for a bind mount if you want the files on a specific disk:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /srv/camera-recordings
