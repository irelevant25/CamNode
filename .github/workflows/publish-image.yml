# Builds the image on GitHub and publishes it to the GitHub Container Registry,
# so a NAS only has to pull ghcr.io/<owner>/<repo>:latest - no building, no SSH,
# no copying source to the host.
name: Publish image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Needs neither a camera nor ffmpeg, so there is no reason to publish an image
  # that fails it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase; repository names need not be.
      - name: Work out the image name and build stamps
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Only needed while linux/arm64 is in the platform list below.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Almost every Docker-capable Synology is x86_64. Dropping linux/arm64
          # roughly halves the build, because the arm64 leg runs under emulation
          # and compiles better-sqlite3 from source.
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', env.SHORT_SHA) }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ env.BUILT_AT }}
            APP_REPO_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
