# ---------------------------------------------------------------------------
# Runs a ready-made image, with no build step. Use this on a Synology NAS
# (Container Manager → Project) or in Portainer's web editor.
#
# By default it pulls the image published by .github/workflows/publish-image.yml.
# Make the package public once, or log the host in to ghcr.io, and the NAS can
# pull it like any other image.
#
# To run an image you built on the host yourself instead, set
#   IMAGE=camera-recordings:latest
# and uncomment `pull_policy: never` so Docker does not try to fetch it.
#
# Required environment variables:
#   APP_SECRET      long random string; signs sessions and derives the key that
#                   encrypts camera passwords. Changing it later means
#                   re-entering them.
#   ADMIN_PASSWORD  first-run password for the admin account.
#   PUBLIC_URL      http://<host-ip>:8080. Cameras POST their ONVIF events to
#                   this address, and a bridged container IP is not reachable
#                   from a camera, so events would never arrive without it.
#                   Can also be set later in Settings, which overrides this.
#
# Portainer has a field for these. Synology's Container Manager does not, so put
# them in a .env file in the same folder as this compose file:
#
#   /volume1/docker/<project>/.env
#     APP_SECRET=...
#     ADMIN_PASSWORD=...
#     PUBLIC_URL=http://<host-ip>:8080
# ---------------------------------------------------------------------------

services:
  camera-recordings:
    image: "${IMAGE:-ghcr.io/irelevant25/camnode:latest}"
    # pull_policy: never   # uncomment when IMAGE is a locally built image
    container_name: camera-recordings
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-Europe/Bratislava}"
      DATA_DIR: /data
      # `:?` on purpose: the stack refuses to deploy rather than silently coming
      # up with a guessable secret. This one signs session cookies and derives
      # the key that encrypts camera passwords in the database.
      APP_SECRET: "${APP_SECRET:?set APP_SECRET to a long random string}"
      # Only applied when the database is created for the first time.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the first-run account}"
      SESSION_HOURS: "${SESSION_HOURS:-72}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      # Database, recordings, snapshots, thumbnails and waveforms.
      - camera-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  camera-data:
    # For files on a specific disk, replace the volume with a bind mount:
    # (create the directory on the host first)
    #
    # volumes:
    #   - /srv/camera-recordings:/data
